{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="create-post-container" x-data="createPostApp()">

  <!-- Top Title & Stepper Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <button @click="prevStep()" x-show="step > 1" class="btn-icon-circle" style="width:34px;height:34px;">
      <i data-lucide="chevron-left" style="width:18px;height:18px;"></i>
    </button>
    <h2 style="font-size:18px;font-weight:700;color:var(--text-main);flex:1;text-align:center;">สร้างโพสต์</h2>
    <div style="width:34px;" x-show="step > 1"></div>
  </div>

  <!-- Stepper Progress Indicator -->
  <div class="stepper-header">
    <div class="stepper-progress">
      <!-- Step 1 -->
      <div class="step-item" :class="{ 'active': step === 1, 'completed': step > 1 }" @click="goToStep(1)" style="cursor:pointer;">
        <div class="step-circle">
          <template x-if="step > 1"><i data-lucide="check" style="width:14px;height:14px;"></i></template>
          <template x-if="step <= 1"><span>1</span></template>
        </div>
        <span class="step-label">รูปภาพ</span>
      </div>

      <!-- Step 2 -->
      <div class="step-item" :class="{ 'active': step === 2, 'completed': step > 2 }" @click="goToStep(2)" style="cursor:pointer;">
        <div class="step-circle">
          <template x-if="step > 2"><i data-lucide="check" style="width:14px;height:14px;"></i></template>
          <template x-if="step <= 2"><span>2</span></template>
        </div>
        <span class="step-label">ตำแหน่ง</span>
      </div>

      <!-- Step 3 -->
      <div class="step-item" :class="{ 'active': step === 3, 'completed': step > 3 }" @click="goToStep(3)" style="cursor:pointer;">
        <div class="step-circle">
          <template x-if="step > 3"><i data-lucide="check" style="width:14px;height:14px;"></i></template>
          <template x-if="step <= 3"><span>3</span></template>
        </div>
        <span class="step-label">รายละเอียด</span>
      </div>

      <!-- Step 4 -->
      <div class="step-item" :class="{ 'active': step === 4 }" @click="goToStep(4)" style="cursor:pointer;">
        <div class="step-circle"><span>4</span></div>
        <span class="step-label">ยืนยัน</span>
      </div>
    </div>
  </div>

  <form method="POST" action="{% url 'posts:create' %}" enctype="multipart/form-data" id="create-post-form">
    {% csrf_token %}
    <input type="hidden" name="lat" :value="lat">
    <input type="hidden" name="lng" :value="lng">
    
    <!-- Hidden container for camera data URLs -->
    <template x-for="(img, idx) in images" :key="img.id">
      <input type="hidden" name="image_urls" :value="img.url">
    </template>
    <input type="file" x-ref="allFilesInput" name="images" multiple style="display:none;">

    <!-- =======================================================================
         STEP 1: MULTI-IMAGE UPLOAD (รูปภาพ - อัปโหลดได้ไม่จำกัด)
         ======================================================================= -->
    <div x-show="step === 1">
      
      <!-- Empty Upload Placeholder -->
      <template x-if="images.length === 0">
        <div class="image-upload-box" @click="$refs.fileInput.click()" style="margin-bottom:16px;height:280px;border-radius:18px;position:relative;background:#F9FAFB;border:2px dashed #CBD5E1;overflow:hidden;cursor:pointer;">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:20px;text-align:center;">
            <div style="width:64px;height:64px;border-radius:50%;background:#E6F5F3;color:#159F8C;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(21,159,140,0.18);">
              <i data-lucide="image-plus" style="width:32px;height:32px;"></i>
            </div>
            <div>
              <div style="font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:6px;">แตะเพื่อเลือกรูปภาพ หรือ ถ่ายรูป</div>
              <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">เลือกได้หลายรูปพร้อมกัน <b>(ไม่จำกัดจำนวนรูป)</b></div>
              <div style="font-size:11.5px;color:var(--text-subtle);">รองรับไฟล์ JPG, PNG, WEBP</div>
            </div>
          </div>
        </div>
      </template>

      <!-- Selected Images Gallery Grid -->
      <template x-if="images.length > 0">
        <div style="margin-bottom:18px;">
          <!-- Gallery Header Info -->
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:14.5px;font-weight:700;color:var(--text-main);">รูปภาพที่เลือก</span>
              <span style="background:var(--primary);color:#FFFFFF;font-size:12px;font-weight:700;padding:2px 10px;border-radius:9999px;" x-text="images.length + ' รูป'"></span>
            </div>
            <button type="button" @click="clearAllImages()" style="background:none;border:none;color:#EF4444;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              <span>ลบทั้งหมด</span>
            </button>
          </div>

          <!-- Thumbnails Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));gap:12px;">
            <template x-for="(img, idx) in images" :key="img.id">
              <div style="position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#F3F4F6;border:2px solid var(--border-subtle);box-shadow:var(--shadow-sm);transition:transform 0.15s;" :style="idx === 0 ? 'border-color:var(--primary);box-shadow:0 0 0 2px rgba(21,159,140,0.3);' : ''">
                
                <!-- Thumbnail Image -->
                <img :src="img.url" alt="Preview" style="width:100%;height:100%;object-fit:cover;">

                <!-- Cover Photo Badge for 1st Image -->
                <template x-if="idx === 0">
                  <div style="position:absolute;top:6px;left:6px;background:rgba(21,159,140,0.92);color:#FFFFFF;padding:2px 8px;border-radius:9999px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:3px;backdrop-filter:blur(4px);box-shadow:0 2px 6px rgba(0,0,0,0.2);">
                    <i data-lucide="star" style="width:10px;height:10px;fill:#FFF;"></i>
                    <span>หน้าปก</span>
                  </div>
                </template>

                <!-- Set As Cover Button (if not cover) -->
                <template x-if="idx > 0">
                  <button type="button" @click.stop="setAsCover(idx)" title="ตั้งเป็นรูปหน้าปก" style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.65);color:#FFFFFF;padding:3px 7px;border-radius:9999px;font-size:10px;font-weight:600;border:none;cursor:pointer;backdrop-filter:blur(4px);">
                    ตั้งเป็นหน้าปก
                  </button>
                </template>

                <!-- Remove Button -->
                <button type="button" @click.stop="removeImage(idx)" title="ลบรูปนี้" style="position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.7);color:#FFFFFF;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                  <i data-lucide="x" style="width:14px;height:14px;"></i>
                </button>
              </div>
            </template>

            <!-- Add More Card in Grid -->
            <div @click="$refs.fileInput.click()" style="aspect-ratio:1/1;border-radius:14px;border:2px dashed #CBD5E1;background:#F8FAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text-muted);transition:all 0.15s;" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)';" onmouseout="this.style.borderColor='#CBD5E1';this.style.color='var(--text-muted)';">
              <div style="width:36px;height:36px;border-radius:50%;background:#E6F5F3;color:#159F8C;display:flex;align-items:center;justify-content:center;">
                <i data-lucide="plus" style="width:20px;height:20px;"></i>
              </div>
              <span style="font-size:12px;font-weight:600;">เพิ่มรูปอีก</span>
            </div>
          </div>
        </div>
      </template>

      <!-- Hidden Inputs for picking files & camera -->
      <input type="file" x-ref="fileInput" @change="handleMultipleImagesUpload($event)" accept="image/*" multiple style="display:none;">
      <input type="file" x-ref="cameraInput" @change="handleCameraUpload($event)" accept="image/*" capture="environment" style="display:none;">

      <!-- Action Buttons -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
        <button type="button" @click="$refs.fileInput.click()" class="btn-secondary" style="border-radius:9999px;min-height:48px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px;font-weight:600;">
          <i data-lucide="image" style="width:18px;height:18px;flex-shrink:0;"></i>
          <span x-text="images.length > 0 ? 'เลือกรูปเพิ่ม' : 'เลือกรูปภาพ'"></span>
        </button>
        <button type="button" @click="openCamera()" class="btn-secondary" style="border-radius:9999px;min-height:48px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px;font-weight:600;">
          <i data-lucide="camera" style="width:18px;height:18px;flex-shrink:0;"></i>
          <span>ถ่ายรูป</span>
        </button>
      </div>

      <button type="button" @click="nextStep()" class="btn-primary" style="min-height:52px;">
        ขั้นตอนถัดไป
        <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
      </button>
    </div>

    <!-- =======================================================================
         STEP 2: LOCATION (ตำแหน่ง)
         ======================================================================= -->
    <div x-show="step === 2">
      <div class="search-input-wrapper" style="margin-bottom:12px;">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" x-model="searchLocationQuery" @keydown.enter.prevent="searchMapLocation()" placeholder="ค้นหาสถานที่ในศรีสะเกษ..." class="search-input">
      </div>

      <!-- Picker Map -->
      <div id="picker-map" style="width:100%;height:260px;border-radius:18px;margin-bottom:14px;border:1px solid var(--border-light);overflow:hidden;"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div style="font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
          <i data-lucide="map-pin" style="width:14px;height:14px;color:var(--primary);"></i>
          <span>พิกัด: <span x-text="lat.toFixed(4) + ', ' + lng.toFixed(4)"></span></span>
        </div>
        <button type="button" @click="useCurrentLocation()" style="font-size:12.5px;color:var(--primary);font-weight:600;display:flex;align-items:center;gap:4px;">
          <i data-lucide="crosshair" style="width:14px;height:14px;"></i>
          <span>ใช้ตำแหน่งปัจจุบัน</span>
        </button>
      </div>

      <button type="button" @click="nextStep()" class="btn-primary" style="min-height:52px;">
        ใช้ตำแหน่งนี้
      </button>
    </div>

    <!-- =======================================================================
         STEP 3: DETAILS (รายละเอียด)
         ======================================================================= -->
    <div x-show="step === 3">
      <div class="form-group">
        <label class="form-label">ชื่อสถานที่ <span style="color:#EF4444;">*</span></label>
        <input type="text" name="place_name" x-model="placeName" placeholder="เช่น วัดมหาพุทธาราม หรือ หอศรีลำดวน" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label">คำอธิบายเรื่องราว</label>
        <textarea name="description" x-model="description" rows="4" placeholder="เล่าเรื่องราวความประทับใจ บรรยากาศ หรือจุดไฮไลท์น่าสนใจ..." class="form-textarea"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">หมวดหมู่</label>
        <select name="category" x-model="selectedCategory" class="form-select">
          {% for cat in categories %}
          <option value="{{ cat.id }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="button" @click="nextStep()" class="btn-primary" style="min-height:52px;">
        ขั้นตอนถัดไป
      </button>
    </div>

    <!-- =======================================================================
         STEP 4: CONFIRM & PREVIEW (ยืนยัน)
         ======================================================================= -->
    <div x-show="step === 4">
      
      <!-- Preview Card -->
      <div style="background:var(--bg-surface, #FFFFFF);border-radius:var(--radius-lg);border:1px solid var(--border-light);overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:24px;">
        
        <!-- Preview Photo Area (Carousel if multiple images) -->
        <div style="width:100%;height:240px;overflow:hidden;background:var(--bg-surface-subtle, #f0f0f0);position:relative;display:flex;align-items:center;justify-content:center;">
          <template x-if="images.length > 0">
            <div style="width:100%;height:100%;position:relative;">
              <img :src="images[previewIndex] ? images[previewIndex].url : images[0].url" alt="Preview" style="width:100%;height:100%;object-fit:cover;">
              
              <!-- Multi-photo indicator badge -->
              <template x-if="images.length > 1">
                <div style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.65);color:#FFFFFF;padding:3px 10px;border-radius:9999px;font-size:11.5px;font-weight:700;backdrop-filter:blur(4px);display:flex;align-items:center;gap:4px;">
                  <i data-lucide="layers" style="width:12px;height:12px;"></i>
                  <span x-text="(previewIndex + 1) + ' / ' + images.length"></span>
                </div>
              </template>

              <!-- Carousel Left/Right Controls -->
              <template x-if="images.length > 1">
                <div>
                  <button type="button" @click.stop="prevPreview()" style="position:absolute;top:50%;left:8px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.5);color:#FFFFFF;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                    <i data-lucide="chevron-left" style="width:16px;height:16px;"></i>
                  </button>
                  <button type="button" @click.stop="nextPreview()" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.5);color:#FFFFFF;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                    <i data-lucide="chevron-right" style="width:16px;height:16px;"></i>
                  </button>
                </div>
              </template>
            </div>
          </template>

          <template x-if="images.length === 0">
            <div style="text-align:center;color:var(--text-muted);font-size:13.5px;">
              <i data-lucide="image" style="width:32px;height:32px;stroke-width:1.5;margin-bottom:6px;"></i>
              <div>ไม่ได้แนบรูปภาพ</div>
            </div>
          </template>
        </div>

        <div style="padding:16px;">
          <h3 style="font-size:17px;font-weight:700;color:var(--text-main);" x-text="placeName || 'ระบุชื่อสถานที่'"></h3>
          <span style="font-size:12.5px;color:var(--text-muted);display:block;margin-bottom:8px;">อ.เมืองศรีสะเกษ • ศรีสะเกษ</span>
          <p style="font-size:13.5px;color:var(--text-main);line-height:1.5;" x-text="description || 'ไม่มีคำอธิบาย'"></p>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;">
        <button type="submit" class="btn-primary" style="min-height:52px;">
          <i data-lucide="send" style="width:18px;height:18px;"></i>
          <span>เผยแพร่โพสต์</span>
        </button>
        <button type="button" @click="prevStep()" class="btn-secondary" style="font-size:14px;padding:12px;min-height:48px;">
          ย้อนกลับไปแก้ไข
        </button>
      </div>

    </div>

  </form>

  <!-- Live WebRTC Camera Modal -->
  <div x-show="showCameraModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);" x-cloak>
    <div style="width:100%;max-width:540px;background:#1E293B;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.5);display:flex;flex-direction:column;position:relative;">
      
      <!-- Modal Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(15,23,42,0.8);color:#FFFFFF;border-bottom:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;">
          <i data-lucide="camera" style="width:20px;height:20px;color:#159F8C;"></i>
          <span>ถ่ายภาพด้วยกล้อง</span>
        </div>
        <button type="button" @click="closeCameraModal()" style="background:rgba(255,255,255,0.15);border:none;color:#FFF;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <!-- Live Video Stream Area -->
      <div style="width:100%;aspect-ratio:4/3;background:#000000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <video x-ref="videoElement" autoplay playsinline style="width:100%;height:100%;object-fit:cover;"></video>
        <canvas x-ref="canvasElement" style="display:none;"></canvas>
      </div>

      <!-- Modal Controls & Shutter Button -->
      <div style="padding:20px;display:flex;align-items:center;justify-content:center;gap:20px;background:#0F172A;">
        <button type="button" @click="closeCameraModal()" style="padding:11px 20px;border-radius:9999px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#94A3B8;font-size:14px;font-weight:600;cursor:pointer;">
          ยกเลิก
        </button>
        <button type="button" @click="captureWebcamPhoto()" style="width:64px;height:64px;border-radius:50%;background:#159F8C;color:#FFFFFF;border:4px solid #FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(21,159,140,0.5);">
          <i data-lucide="camera" style="width:28px;height:28px;"></i>
        </button>
      </div>

    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
  let pickerMap = null;
  let pickerMarker = null;
  let pickerCircle = null;

  function createPostApp() {
    return {
      step: 1,
      images: [], // List of { id, url, file }
      previewIndex: 0,
      placeName: '',
      description: '',
      selectedCategory: '{% if categories %}{{ categories.first.id }}{% endif %}',
      searchLocationQuery: '',
      lat: 15.1120,
      lng: 104.3180,

      showCameraModal: false,
      cameraStream: null,

      init() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlStep = parseInt(urlParams.get('step'));
        if (urlStep >= 1 && urlStep <= 4) {
          this.goToStep(urlStep);
        }
      },

      openCamera() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
            .then(stream => {
              this.cameraStream = stream;
              this.showCameraModal = true;
              this.$nextTick(() => {
                const video = this.$refs.videoElement;
                if (video) {
                  video.srcObject = stream;
                  video.play();
                }
                if (window.lucide) lucide.createIcons();
              });
            })
            .catch(err => {
              console.warn('WebRTC camera error, falling back to file input:', err);
              if (this.$refs.cameraInput) this.$refs.cameraInput.click();
            });
        } else {
          if (this.$refs.cameraInput) this.$refs.cameraInput.click();
        }
      },

      closeCameraModal() {
        if (this.cameraStream) {
          this.cameraStream.getTracks().forEach(track => track.stop());
          this.cameraStream = null;
        }
        this.showCameraModal = false;
      },

      captureWebcamPhoto() {
        const video = this.$refs.videoElement;
        const canvas = this.$refs.canvasElement;
        if (!video || !canvas) return;

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        
        canvas.toBlob((blob) => {
          const file = blob ? new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' }) : null;
          this.images.push({
            id: 'cam_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            url: dataUrl,
            file: file
          });
          this.syncFileInput();
          this.$nextTick(() => {
            if (window.lucide) lucide.createIcons();
          });
        }, 'image/jpeg', 0.92);

        this.closeCameraModal();
      },

      handleCameraUpload(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            this.images.push({
              id: 'cam_file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              url: e.target.result,
              file: file
            });
            this.syncFileInput();
            this.$nextTick(() => {
              if (window.lucide) lucide.createIcons();
            });
          };
          reader.readAsDataURL(file);
        }
      },

      handleMultipleImagesUpload(event) {
        const files = Array.from(event.target.files || []);
        if (files.length === 0) return;

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            this.images.push({
              id: 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              url: e.target.result,
              file: file
            });
            this.syncFileInput();
            this.$nextTick(() => {
              if (window.lucide) lucide.createIcons();
            });
          };
          reader.readAsDataURL(file);
        });

        // Reset input value so same files can be re-selected if desired
        event.target.value = '';
      },

      removeImage(index) {
        this.images.splice(index, 1);
        if (this.previewIndex >= this.images.length) {
          this.previewIndex = Math.max(0, this.images.length - 1);
        }
        this.syncFileInput();
        this.$nextTick(() => {
          if (window.lucide) lucide.createIcons();
        });
      },

      setAsCover(index) {
        if (index > 0 && index < this.images.length) {
          const chosen = this.images.splice(index, 1)[0];
          this.images.unshift(chosen);
          this.syncFileInput();
          this.$nextTick(() => {
            if (window.lucide) lucide.createIcons();
          });
        }
      },

      clearAllImages() {
        this.images = [];
        this.previewIndex = 0;
        this.syncFileInput();
        if (this.$refs.fileInput) this.$refs.fileInput.value = '';
        if (this.$refs.cameraInput) this.$refs.cameraInput.value = '';
      },

      syncFileInput() {
        if (!this.$refs.allFilesInput) return;
        try {
          const dt = new DataTransfer();
          this.images.forEach(img => {
            if (img.file) {
              dt.items.add(img.file);
            }
          });
          this.$refs.allFilesInput.files = dt.files;
        } catch (e) {
          console.warn('DataTransfer sync error:', e);
        }
      },

      prevPreview() {
        if (this.images.length > 1) {
          this.previewIndex = (this.previewIndex - 1 + this.images.length) % this.images.length;
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        }
      },

      nextPreview() {
        if (this.images.length > 1) {
          this.previewIndex = (this.previewIndex + 1) % this.images.length;
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        }
      },

      goToStep(n) {
        this.step = n;
        if (this.step === 2) {
          setTimeout(() => {
            initPickerMap(this.lat, this.lng, this);
          }, 100);
        }
        this.$nextTick(() => {
          if (window.lucide) lucide.createIcons();
        });
      },

      nextStep() {
        if (this.step < 4) {
          this.goToStep(this.step + 1);
        }
      },

      prevStep() {
        if (this.step > 1) {
          this.goToStep(this.step - 1);
        }
      },

      searchMapLocation() {
        if (!this.searchLocationQuery) return;
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.searchLocationQuery + ' Sisaket')}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.length > 0) {
              const item = data[0];
              const newLat = parseFloat(item.lat);
              const newLng = parseFloat(item.lon);
              this.lat = newLat;
              this.lng = newLng;
              if (pickerMap) {
                pickerMap.flyTo([newLat, newLng], 15);
                if (pickerMarker) pickerMarker.setLatLng([newLat, newLng]);
                if (pickerCircle) pickerCircle.setLatLng([newLat, newLng]);
              }
            }
          })
          .catch(err => console.error('Geocoding error:', err));
      },

      useCurrentLocation() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(pos => {
          this.lat = pos.coords.latitude;
          this.lng = pos.coords.longitude;
          if (pickerMap) {
            pickerMap.flyTo([this.lat, this.lng], 15);
            if (pickerMarker) pickerMarker.setLatLng([this.lat, this.lng]);
            if (pickerCircle) pickerCircle.setLatLng([this.lat, this.lng]);
          }
        });
      }
    };
  }

  function initPickerMap(lat, lng, alpineComponent) {
    const container = document.getElementById('picker-map');
    if (!container) return;
    if (pickerMap) {
      pickerMap.invalidateSize();
      pickerMap.setView([lat, lng], 14);
      return;
    }

    pickerMap = L.map('picker-map', {
      center: [lat, lng],
      zoom: 14,
      minZoom: 4,
      maxZoom: 19,
      zoomControl: false,
      attributionControl: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(pickerMap);

    setTimeout(() => {
      if (pickerMap) {
        pickerMap.invalidateSize();
        pickerMap.setView([lat, lng], 14);
      }
    }, 150);

    pickerCircle = L.circle([lat, lng], {
      radius: 400,
      color: '#159F8C',
      fillColor: '#159F8C',
      fillOpacity: 0.15,
      weight: 1.5
    }).addTo(pickerMap);

    pickerMarker = L.circleMarker([lat, lng], {
      radius: 10,
      color: '#FFFFFF',
      fillColor: '#159F8C',
      fillOpacity: 1,
      weight: 3
    }).addTo(pickerMap);

    pickerMap.on('click', (e) => {
      const newLat = e.latlng.lat;
      const newLng = e.latlng.lng;
      alpineComponent.lat = newLat;
      alpineComponent.lng = newLng;
      pickerMarker.setLatLng([newLat, newLng]);
      pickerCircle.setLatLng([newLat, newLng]);
    });
  }
</script>
{% endblock %}
