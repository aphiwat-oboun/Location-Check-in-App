{% extends 'base.html' %}
{% load static %}

{% block title %}แก้ไขโพสต์ - ที่นี่มีอะไร?{% endblock %}

{% block content %}
<div style="flex:1;overflow-y:auto;padding:24px 16px;max-width:680px;margin:0 auto;width:100%;">

  <!-- Header & Back Button -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <a href="{% url 'posts:detail' post.id %}" class="btn-icon-circle" style="width:36px;height:36px;">
      <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
    </a>
    <h2 style="font-size:18px;font-weight:700;color:var(--text-main);margin:0;">แก้ไขโพสต์</h2>
    <div style="width:36px;"></div>
  </div>

  <!-- Edit Card -->
  <div style="background:#FFFFFF;border-radius:var(--radius-lg);border:1px solid var(--border-light);padding:24px;box-shadow:var(--shadow-sm);">
    <form method="POST" action="{% url 'posts:edit' post.id %}" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Photo Preview & Replace Option -->
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:13.5px;font-weight:600;color:var(--text-main);margin-bottom:8px;">
          รูปภาพโพสต์
        </label>
        <div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#F3F4F6;margin-bottom:10px;">
          <img id="editImagePreview" src="{{ post.get_cover_url }}" alt="{{ post.location.name }}" style="width:100%;height:100%;object-fit:cover;">
        </div>
        <label for="editPhotoInput" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9999px;background:var(--bg-surface-subtle);border:1px solid var(--border-light);font-size:13px;font-weight:600;color:var(--text-main);cursor:pointer;">
          <i data-lucide="camera" style="width:15px;height:15px;color:var(--primary);"></i>
          <span>เปลี่ยนรูปภาพใหม่</span>
        </label>
        <input type="file" id="editPhotoInput" name="image" accept="image/*" style="display:none;" onchange="previewEditImage(event)">
      </div>

      <!-- Place Name -->
      <div style="margin-bottom:18px;">
        <label for="placeNameInput" style="display:block;font-size:13.5px;font-weight:600;color:var(--text-main);margin-bottom:8px;">
          ชื่อสถานที่
        </label>
        <input type="text" id="placeNameInput" name="place_name" value="{{ post.location.name }}" required class="form-input" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border-light);font-size:14px;">
      </div>

      <!-- Category -->
      <div style="margin-bottom:18px;">
        <label for="categorySelect" style="display:block;font-size:13.5px;font-weight:600;color:var(--text-main);margin-bottom:8px;">
          หมวดหมู่
        </label>
        <select id="categorySelect" name="category" class="form-input" style="width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border-light);font-size:14px;background:#FFF;">
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if post.category_id == cat.id %}selected{% endif %}>
            {{ cat.name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- Caption -->
      <div style="margin-bottom:24px;">
        <label for="captionInput" style="display:block;font-size:13.5px;font-weight:600;color:var(--text-main);margin-bottom:8px;">
          คำบรรยาย / เล่าเรื่องราว
        </label>
        <textarea id="captionInput" name="caption" rows="4" class="form-input" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-light);font-size:14px;resize:vertical;" placeholder="เล่าเรื่องราวหรือบรรยากาศของสถานที่นี้...">{{ post.caption }}</textarea>
      </div>

      <!-- Action Buttons -->
      <div style="display:flex;flex-direction:column;gap:12px;">
        <button type="submit" class="btn-primary" style="width:100%;min-height:46px;border-radius:9999px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;">
          <i data-lucide="check" style="width:18px;height:18px;"></i>
          <span>บันทึกการแก้ไข</span>
        </button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <a href="{% url 'posts:detail' post.id %}" style="display:flex;align-items:center;justify-content:center;padding:10px;border-radius:9999px;border:1px solid var(--border-light);background:#F9FAFB;color:#4B5563;font-size:13.5px;font-weight:600;text-decoration:none;">
            ยกเลิก
          </a>
          <button type="button" onclick="confirmDeletePost({{ post.id }})" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:9999px;border:1px solid #FCA5A5;background:#FEF2F2;color:#EF4444;font-size:13.5px;font-weight:600;cursor:pointer;">
            <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
            <span>ลบโพสต์นี้</span>
          </button>
        </div>
      </div>
    </form>
  </div>

</div>

<script>
  function previewEditImage(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('editImagePreview');
        if (preview) preview.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }
</script>
{% endblock %}
