{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:24px;width:100%;">
  <div style="max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;">
    
    <!-- Title -->
    <h1 style="font-size:28px;font-weight:700;color:var(--text-main);margin-bottom:8px;letter-spacing:-0.5px;">
      ที่นี่มีอะไร?
    </h1>
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:32px;line-height:1.5;">
      ค้นพบสถานที่น่าสนใจ<br>ผ่านเรื่องราวและรูปภาพจากผู้คน
    </p>

    <!-- Travel Graphic Illustration -->
    <div style="width:100%;aspect-ratio:1.2;border-radius:var(--radius-xl);overflow:hidden;margin-bottom:36px;box-shadow:var(--shadow-md);position:relative;">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Discover Thailand" style="width:100%;height:100%;object-fit:cover;">
      <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 60%);display:flex;align-items:flex-end;justify-content:center;padding:16px;">
        <span style="color:#FFF;font-size:13px;font-weight:500;text-shadow:0 2px 4px rgba(0,0,0,0.5);">📍 สำรวจมุมมองใหม่รอบตัวคุณ</span>
      </div>
    </div>

    <!-- Actions -->
    <a href="{% url 'core:home' %}" class="btn-primary" style="margin-bottom:16px;">
      เริ่มต้นสำรวจ
    </a>

    <a href="{% url 'accounts:login' %}" style="font-size:13.5px;color:var(--text-muted);font-weight:500;">
      มีบัญชีอยู่แล้ว? <span style="color:var(--primary);font-weight:600;">เข้าสู่ระบบ</span>
    </a>

  </div>
</div>
{% endblock %}
