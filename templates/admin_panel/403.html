<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>403 Forbidden - Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-color: #F7F7F5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .badge {
      background-color: #FEE2E2;
      color: #DC2626;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      color: #1F2937;
      margin-bottom: 8px;
    }
    p {
      color: #6B7280;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #159F8C;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">403 FORBIDDEN</span>
    <h1>ปฏิเสธการเข้าถึง</h1>
    <p>{{ reason|default:"คุณไม่มีสิทธิ์เข้าถึงส่วนนี้ บัญชีของคุณไม่ใช่ผู้ดูแลระบบ (Administrator)" }}</p>
    <a href="/" class="btn">กลับสู่หน้าหลัก</a>
  </div>
</body>
</html>
