<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <linearGradient id="bmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04221F" />
      <stop offset="50%" stop-color="#0C4841" />
      <stop offset="100%" stop-color="#148F7F" />
    </linearGradient>
    <linearGradient id="bmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bmPin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F0FDFB" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="bmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#021110" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Badge Squircle -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#bmBg)" />
  <rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="url(#bmGold)" stroke-width="1.2" stroke-opacity="0.9" />
  <rect x="2.5" y="2.5" width="35" height="35" rx="8.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />

  <!-- Pin Graphic -->
  <g filter="url(#bmShadow)" transform="translate(0, -0.5)">
    <path d="M20 6 C13.5 6 8.5 11.2 8.5 17.5 C8.5 25.5 18.8 33.2 19.5 33.8 C19.8 34 20.2 34 20.5 33.8 C21.2 33.2 31.5 25.5 31.5 17.5 C31.5 11.2 26.5 6 20 6 Z" 
          fill="url(#bmPin)" />
    
    <circle cx="20" cy="17" r="6.8" fill="#042320" />
    <circle cx="20" cy="17" r="6.8" fill="none" stroke="url(#bmGold)" stroke-width="1" />

    <!-- 4-Point Golden Star -->
    <path d="M20 12 Q20 17 25 17 Q20 17 20 22 Q20 17 15 17 Q20 17 20 12 Z" fill="url(#bmGold)" />
    <circle cx="20" cy="17" r="1.3" fill="#FFFDF0" />
  </g>
</svg>
