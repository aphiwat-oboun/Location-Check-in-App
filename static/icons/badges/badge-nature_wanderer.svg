<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="b7Jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="b7Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#00140F" />
    </linearGradient>
    <filter id="b7Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#064E3B" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#b7Shadow)">
    <circle cx="50" cy="50" r="44" fill="url(#b7Bg)" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#b7Jade)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Mountain Peaks, Sun & Pines -->
    <g transform="translate(50, 48)">
      <!-- Golden Sun -->
      <circle cx="12" cy="-14" r="7" fill="#FDE047" opacity="0.9" />

      <!-- Back Mountain -->
      <polygon points="-8,-12 18,16 -18,16" fill="#047857" />
      
      <!-- Front Mountain -->
      <polygon points="-16,-4 10,18 -26,18" fill="url(#b7Jade)" />
      <!-- Snow Cap -->
      <polygon points="-16,-4 -11,2 -13,0 -16,4 -18,0 -20,2" fill="#FFFFFF" />

      <!-- Foreground Evergreen Pine Trees -->
      <polygon points="12,2 18,12 6,12" fill="url(#b7Jade)" />
      <polygon points="12,8 20,18 4,18" fill="url(#b7Jade)" />
      
      <!-- Ground line -->
      <line x1="-24" y1="18" x2="24" y2="18" stroke="url(#b7Jade)" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
