<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="b3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="b3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#2D1102" />
      <stop offset="100%" stop-color="#0F0500" />
    </linearGradient>
    <filter id="b3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#381502" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#b3Shadow)">
    <circle cx="50" cy="50" r="44" fill="url(#b3Bg)" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#b3Gold)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Golden Laurels & Award Star Shield -->
    <g transform="translate(50, 48)">
      <!-- Left Laurel Leaf Wreath -->
      <path d="M-18 18 C-30 6 -28 -14 -14 -24 C-22 -14 -22 6 -14 16 Z" fill="url(#b3Gold)" />
      <!-- Right Laurel Leaf Wreath -->
      <path d="M18 18 C30 6 28 -14 14 -24 C22 -14 22 6 14 16 Z" fill="url(#b3Gold)" />

      <!-- Center Award Shield -->
      <polygon points="0,-16 12,-6 12,12 0,22 -12,12 -12,-6" fill="url(#b3Gold)" />
      <polygon points="0,-12 9,-4 9,10 0,18 -9,10 -9,-4" fill="#2A1002" />
      
      <!-- Golden Star -->
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="url(#b3Gold)" />
    </g>
  </g>
</svg>
