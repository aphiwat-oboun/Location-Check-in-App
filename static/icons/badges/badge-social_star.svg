      <line x1="20" y1="-20" x2="17" y2="-17" stroke="url(#b8Ruby)" stroke-width="2" stroke-linecap="round" />
      <line x1="-20" y1="-20" x2="-17" y2="-17" stroke="url(#b8Ruby)" stroke-width="2" stroke-linecap="round" />

