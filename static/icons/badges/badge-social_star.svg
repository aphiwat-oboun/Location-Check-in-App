      <path d="M0 16 L-1.5 14.5 C-12 5.5 -18 -0.5 -18 -8 C-18 -14.2 -13.2 -19 -7 -19 C-3.5 -19 -0.5 -17.4 0 -15 C0.5 -17.4 3.5 -19 7 -19 C13.2 -19 18 -14.2 18 -8 C18 -0.5 12 5.5 1.5 14.5 L0 16 Z" 
