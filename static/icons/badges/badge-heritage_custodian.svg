<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="b6Emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="b6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="60%" stop-color="#011B15" />
      <stop offset="100%" stop-color="#000D0A" />
    </linearGradient>
    <filter id="b6Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#022C22" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#b6Shadow)">
    <circle cx="50" cy="50" r="44" fill="url(#b6Bg)" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#b6Emerald)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Sacred Khmer Temple / Prang Spire -->
    <g transform="translate(50, 48)">
      <!-- Spire Pinnacle Jewel -->
      <circle cx="0" cy="-24" r="2.5" fill="#FFFBEB" />
      
      <!-- Spire Roof Layers -->
      <polygon points="0,-22 5,-16 -5,-16" fill="url(#b6Emerald)" />
      <polygon points="0,-16 9,-10 -9,-10" fill="url(#b6Emerald)" />
      <polygon points="0,-10 14,-2 -14,-2" fill="url(#b6Emerald)" />
      
      <!-- Temple Sanctuary Body -->
      <rect x="-15" y="-2" width="30" height="18" fill="url(#b6Emerald)" />
      <!-- Arch Entrance Door -->
      <path d="M-6 16 L-6 6 Q0 2 6 6 L6 16 Z" fill="#011B15" />
      
      <!-- Base Plinth -->
      <rect x="-20" y="16" width="40" height="4" rx="2" fill="url(#b6Emerald)" />
    </g>
  </g>
</svg>
