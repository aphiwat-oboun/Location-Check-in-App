<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Emerald Obsidian Canvas Gradient -->
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031715" />
      <stop offset="25%" stop-color="#062825" />
      <stop offset="55%" stop-color="#0A3F3A" />
      <stop offset="85%" stop-color="#0F5E56" />
      <stop offset="100%" stop-color="#159F8C" />
    </linearGradient>

    <!-- Radial Emerald Ambient Light Diffusion -->
    <radialGradient id="ambientGlow512" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#14B8A6" stop-opacity="0.18" />
      <stop offset="75%" stop-color="#0F766E" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 24K Champagne Gold Metallic Gradient -->
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="18%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Lustrous Gold Flare -->
    <linearGradient id="goldFlare512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.3" />
    </linearGradient>

    <!-- Pearl Platinum & Aqua Shimmer for Pin -->
    <linearGradient id="pinGrad512" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="65%" stop-color="#E0F2FE" />
      <stop offset="90%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="glassSheen512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.36" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ultra High-End Drop Shadows with ambient occlusion -->
    <filter id="masterDropShadow512" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#010A09" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06211E" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14B8A6" flood-opacity="0.25" />
    </filter>

    <filter id="starGlow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Superellipse (Squircle) -->
  <rect x="12" y="12" width="488" height="488" rx="122" fill="url(#bgGrad512)" />
  <rect x="12" y="12" width="488" height="488" rx="122" fill="url(#ambientGlow512)" />

  <!-- Outer 24K Gold Luxury Beveled Frame -->
  <rect x="13.5" y="13.5" width="485" height="485" rx="120.5" fill="none" stroke="url(#goldGrad512)" stroke-width="6.5" stroke-opacity="0.95" />

  <!-- Inner Refined Luminous Inset Line -->
  <rect x="25" y="25" width="462" height="462" rx="109" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2.5" />

  <!-- Glass Specular Curve Reflection -->
  <path d="M12 135 C12 68 68 12 135 12 L377 12 C444 12 500 68 500 135 C500 210 320 270 12 220 Z" fill="url(#glassSheen512)" />

  <!-- Main Luxury Pin Glyph Assembly -->
  <g filter="url(#masterDropShadow512)">
    <!-- Golden Backing Halo Frame -->
    <path d="M256 64 C172 64 104 132 104 216 C104 320 237.3 420 248.8 428.5 C253.1 431.7 258.9 431.7 263.2 428.5 C274.7 420 408 320 408 216 C408 132 340 64 256 64 Z" 
          fill="none" stroke="url(#goldGrad512)" stroke-width="8" stroke-opacity="0.9" />

    <!-- Platinum & Pearl Solid Core Pin -->
    <path d="M256 70 C176 70 112 134 112 214 C112 314 239 410.8 250.2 419.1 C253.7 421.7 258.3 421.7 261.8 419.1 C273 410.8 400 314 400 214 C400 134 336 70 256 70 Z" 
          fill="url(#pinGrad512)" />

    <!-- Specular Highlight Curve on Pin Crown -->
    <path d="M256 75 C186 75 133 129 128 198 C150 144 214 118 310 120 C352 121 374 131 384 145 C379 105 323 75 256 75 Z" 
          fill="#FFFFFF" fill-opacity="0.7" />

    <!-- Deep Emerald Obsidian Inset Gem Chamber -->
    <circle cx="256" cy="205" r="85" fill="#031E1B" />
    <circle cx="256" cy="205" r="85" fill="none" stroke="url(#goldGrad512)" stroke-width="6.5" />
    <circle cx="256" cy="205" r="74" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

    <!-- Secondary Diagonal 4-Point Shimmer Star (Background Rotated) -->
    <path d="M256 162 Q256 205 299 205 Q256 205 256 248 Q256 205 213 205 Q256 205 256 162 Z" 
          transform="rotate(45 256 205)" fill="url(#goldFlare512)" opacity="0.65" />

    <!-- Primary Diamond Compass Star Core -->
    <path d="M256 146 Q256 205 315 205 Q256 205 256 264 Q256 205 197 205 Q256 205 256 146 Z" 
          fill="url(#goldGrad512)" filter="url(#starGlow512)" />

    <!-- Pure Brilliant Center Diamond Gemstone -->
    <circle cx="256" cy="205" r="12" fill="#FFFBEB" />
    <circle cx="256" cy="205" r="6" fill="#FFFFFF" />
  </g>

  <!-- Ambient Luxury Sparkles & Diamond Crystals -->
  <!-- Top Right Jewel Sparkle -->
  <g transform="translate(405, 95)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" fill="url(#goldGrad512)" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Bottom Left Micro Jewel Sparkle -->
  <g transform="translate(95, 410) scale(0.65)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" fill="url(#goldGrad512)" opacity="0.8" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
