<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041D1B" />
      <stop offset="40%" stop-color="#093833" />
      <stop offset="75%" stop-color="#0E574E" />
      <stop offset="100%" stop-color="#148376" />
    </linearGradient>

    <radialGradient id="appleGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="appleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="applePin" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0FDFB" />
      <stop offset="80%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>

    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#010D0C" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- iOS Clean Corner Surface -->
  <rect width="180" height="180" fill="url(#appleBg)" />
  <rect width="180" height="180" fill="url(#appleGlow)" />
  <rect x="2" y="2" width="176" height="176" rx="40" fill="none" stroke="url(#appleGold)" stroke-width="2.5" stroke-opacity="0.8" />

  <g filter="url(#appleShadow)" transform="translate(-6, -6)">
    <!-- Golden Halo Ring -->
    <path d="M96 24 C64.5 24 39 49.5 39 81 C39 120 89 157.5 93.3 160.7 C94.9 161.9 97.1 161.9 98.7 160.7 C103 157.5 153 120 153 81 C153 49.5 127.5 24 96 24 Z" 
          fill="none" stroke="url(#appleGold)" stroke-width="3" stroke-opacity="0.85" />

    <!-- Pearl Map Pin -->
    <path d="M96 26 C66.2 26 42 50.2 42 80 C42 117.5 89.6 153.8 93.8 156.9 C95.1 157.9 96.9 157.9 98.2 156.9 C102.4 153.8 150 117.5 150 80 C150 50.2 125.8 26 96 26 Z" 
          fill="url(#applePin)" />

    <!-- Emerald Center Core -->
    <circle cx="96" cy="77" r="30" fill="#042320" />
    <circle cx="96" cy="77" r="30" fill="none" stroke="url(#appleGold)" stroke-width="2.5" />

    <!-- 4-Point Golden Star -->
    <path d="M96 56 Q96 77 117 77 Q96 77 96 98 Q96 77 75 77 Q96 77 96 56 Z" fill="url(#appleGold)" />
    <circle cx="96" cy="77" r="4" fill="#FFFDF5" />
  </g>
</svg>
