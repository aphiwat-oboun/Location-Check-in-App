<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Sterling Silver Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Deep Sapphire Ocean Gradient -->
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyan Blue Glow -->
    <linearGradient id="cyanFlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="specularSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

  </defs>

  <g>
    <!-- Winged Base Accents -->
    <path d="M12 42 Q30 32 46 44 L46 68 Q24 64 12 42 Z" fill="url(#silverGrad)" />
    <path d="M108 42 Q90 32 74 44 L74 68 Q96 64 108 42 Z" fill="url(#silverGrad)" />

    <!-- Main Diamond Octagon Shield -->
    <polygon points="60,6 100,28 100,74 60,112 20,74 20,28" fill="url(#silverGrad)" />
    <polygon points="60,14 92,34 92,70 60,102 28,70 28,34" fill="url(#sapphireGrad)" />
    <polygon points="60,14 92,34 92,70 60,102 28,70 28,34" fill="none" stroke="url(#silverGrad)" stroke-width="2" />

    <!-- Specular Highlight -->
    <path d="M28 34 L60 14 L92 34 L92 52 Q60 40 28 52 Z" fill="url(#specularSilver)" />

    <!-- Center Sapphire Star Pin & Compass Gem -->
    <g transform="translate(60, 55)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="23" fill="none" stroke="url(#silverGrad)" stroke-width="2" />
      <circle cx="0" cy="0" r="19" fill="#0A192F" />

      <!-- 8-Point Navigation Star -->
      <path d="M0 -15 Q0 0 15 0 Q0 0 0 15 Q0 0 -15 0 Q0 0 0 -15 Z" fill="url(#cyanFlare)" />
      <polygon points="0,-18 3,-5 18,0 3,5 0,18 -3,5 -18,0 -3,-5" fill="url(#silverGrad)" opacity="0.85" />

      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2" fill="#0284C7" />
    </g>

    <!-- Level Tag Pill -->
    <rect x="36" y="90" width="48" height="18" rx="9" fill="url(#silverGrad)" />
    <rect x="37" y="91" width="46" height="16" rx="8" fill="#020617" />
    <text x="60" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">LV.2</text>
  </g>
</svg>
